name: besu-distributed-node3

services:
  besu-node3:
    image: hyperledger/besu:26.11.0
    container_name: besu-distributed-node3
    restart: unless-stopped
    user: root

    environment:
      BESU_OPTS: "-Xmx512m"

    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/node/key
      - --static-nodes-file=/config/static-nodes.json

      # Kết nối P2P qua Tailscale
      - --p2p-enabled=true
      - --p2p-port=30303
      - --p2p-host=100.125.228.77

      # JSON-RPC
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,TXPOOL
      - --host-allowlist=*

      - --min-gas-price=0

    ports:
      - "127.0.0.1:8553:8545"
      - "100.125.228.77:30303:30303/tcp"
      - "100.125.228.77:30303:30303/udp"

    volumes:
      - ./besu/distributed/genesis.json:/config/genesis.json:ro
      - ./besu/distributed/static-nodes.json:/config/static-nodes.json:ro
      - ./besu/distributed/node3:/config/node:ro
      - besu-distributed-data-3:/opt/besu/data

volumes:
  besu-distributed-data-3: